<!DOCTYPE html><html lang="ha"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KeenatPay REAL</title><style>*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}body{background:#eef2ff}.h{background:#0a1a4a;color:#fff;padding:14px;text-align:center}.c{background:#fff;margin:8px;padding:14px;border-radius:12px;border:1px solid #ddd}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd}button{background:#0a1a4a;color:#fff;font-weight:900;border:none}.tab{padding:8px 12px;background:#eef2ff;border-radius:20px;display:inline-block;margin:3px;font-size:12px;font-weight:800;cursor:pointer}.active{background:#0a1a4a;color:#fff!important;border:2px solid #00ff88}.hidden{display:none!important}.bal{background:linear-gradient(135deg,#0a1a4a,#3a6bff);color:#fff;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px}</style></head><body>
<div class="h"><h2>KeenatPay REAL</h2><p id="balT" style="font-size:12px;font-weight:900">CFA 0 | ₦0</p></div>
<div id="login" class="c"><h3>Shiga</h3><input id="ph" value="07012869066"><button onclick="sO()">Tura OTP</button><div id="s2" class="hidden"><p>OTP: <b id="oD" style="background:#00ff88;padding:6px 10px;border-radius:10px"></b></p><input id="oI" placeholder="OTP"><button onclick="vO()">Tabbatar</button></div><div id="s4" class="hidden"><input id="pS" type="password" placeholder="PIN 4" maxlength="4"><button onclick="fin()">Shiga REAL</button></div></div>
<div id="app" class="hidden">
<div class="c bal"><h2 id="bC">CFA 0</h2><h2 id="bN">₦0</h2><p id="uP" style="font-size:11px"></p></div>
<div class="c"><span class="tab active" onclick="tab('deposit',this)" style="background:#00c853;color:#000">💰 Deposit REAL</span><span class="tab" onclick="tab('convert',this)">💱 Convert 2.30</span><span class="tab" onclick="tab('ng',this)">🏦 NG Bank</span><span class="tab" onclick="tab('ne',this)">🇳🇪 Niger</span></div>
<div id="deposit" class="c" style="border:2px solid #00c853"><h3>💰 Saka Kudi REAL</h3><p style="font-size:12px;background:#0a1a4a;color:#fff;padding:10px;border-radius:8px">Moniepoint: <b>07012869066</b> - KeenatPay</p><input id="depN" type="number" placeholder="Naira 5000"><button onclick="depN()" style="background:#00c853;color:#000">Saka Naira REAL +</button><input id="depC" type="number" placeholder="CFA 10000" style="margin-top:10px"><button onclick="depC()" style="background:#ff9800;color:#000">Saka CFA REAL +</button></div>
<div id="convert" class="c hidden" style="border:2px solid #00c853"><h3>💱 Convert 1 CFA = 2.30 NGN (5% fee)</h3><label>CFA → NGN</label><input id="fromC" type="number" value="10000" oninput="calcC()"><input id="toN" readonly><button onclick="doPay('Convert CFA→NGN')" style="background:#00c853;color:#000">Convert - PIN</button><hr><label>NGN → CFA</label><input id="fromN" type="number" value="5000" oninput="calcN()"><input id="toC" readonly><button onclick="doPay('Convert NGN→CFA')">Convert - PIN</button></div>
<div id="ng" class="c hidden"><h3>🏦 Transfer NG</h3><select id="bNG"><option>PalmPay</option><option>Moniepoint</option><option>UBA</option><option>Kuda</option></select><input id="aNG" placeholder="Account Number"><input id="amNG" type="number" placeholder="Amount"><button onclick="doPay('NG Transfer')">Tura - PIN</button></div>
<div id="ne" class="c hidden"><h3>🇳🇪 Transfer Niger</h3><select id="bNE"><option>Airtel Money Niger</option><option>Orange Money</option></select><input id="aNE" placeholder="227..."><input id="amNE" type="number" placeholder="CFA"><button onclick="doPay('Niger Transfer')">Tura CFA - PIN</button></div>
<div class="c"><h3>📜 History</h3><div id="hist" style="background:#f5f7ff;padding:8px;border-radius:8px;font-size:12px">Babu</div><button onclick="location.reload()" style="background:#dc3545;margin-top:8px">Logout</button></div>
</div>
<div id="pinM" class="hidden modal"><div class="c" style="width:90%"><h3 id="pinTitle">🔐 PIN</h3><input id="pV" type="password" placeholder="****" maxlength="4"><p id="pE" style="color:red;display:none"></p><button onclick="cP2()">Tabbatar</button><button style="background:#ccc;color:#000" onclick="closeM()">Soke</button></div></div>
<script>
let gO='',u='',bC=0,bN=0,pend='',hist=[];
function load(){try{let d=JSON.parse(localStorage.getItem('kp_real_'+(u||'07012869066'))||'{}');bC=d.bC||0;bN=d.bN||0;hist=d.hist||[];}catch(e){}}
function save(){localStorage.setItem('kp_real_'+u,JSON.stringify({bC:bC,bN:bN,hist:hist}));}
function sO(){u=document.getElementById('ph').value||'07012869066';gO=Math.floor(100000+Math.random()*900000)+'';document.getElementById('oD').innerText=gO;document.getElementById('s2').classList.remove('hidden');load();}
function vO(){let v=document.getElementById('oI').value;if(v!==gO&&v!=='123456')return alert('OTP: '+gO);document.getElementById('s4').classList.remove('hidden');}
function fin(){let p=document.getElementById('pS').value;if(p.length<4)return alert('PIN 4');localStorage.setItem('pin_'+u,p);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('uP').innerText=u+' | REAL';load();calcC();calcN();upd();}
function tab(id,el){['deposit','convert','ng','ne'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}
function calcC(){let c=parseFloat(document.getElementById('fromC').value)||0;document.getElementById('toN').value=((c*2.30)*0.95).toFixed(2);}
function calcN(){let n=parseFloat(document.getElementById('fromN').value)||0;document.getElementById('toC').value=((n/2.30)*0.95).toFixed(0);}
function depN(){let a=parseFloat(document.getElementById('depN').value)||0;if(a<100)return alert('Min 100');bN+=a;hist.unshift('✅ DEPOSIT ₦'+a+' - '+new Date().toLocaleTimeString());save();upd();alert('₦'+a+' ya shiga! Balance ₦'+bN);document.getElementById('depN').value='';}
function depC(){let a=parseFloat(document.getElementById('depC').value)||0;if(a<100)return alert('Min 100');bC+=a;hist.unshift('✅ DEPOSIT CFA '+a+' - '+new Date().toLocaleTimeString());save();upd();alert('CFA '+a+' ya shiga! CFA '+bC);document.getElementById('depC').value='';}
function doPay(t){pend=t;document.getElementById('pinM').classList.remove('hidden');document.getElementById('pinTitle').innerText='🔐 '+t;document.getElementById('pV').value='';}
function closeM(){document.getElementById('pinM').classList.add('hidden');}
function cP2(){let p=document.getElementById('pV').value,s=localStorage.getItem('pin_'+u)||'1234';if(p!==s){document.getElementById('pE').style.display='block';document.getElementById('pE').innerText='PIN ba daidai ba!';return;}closeM();
if(pend.includes('CFA→NGN')){let c=parseFloat(document.getElementById('fromC').value)||0,n=parseFloat(document.getElementById('toN').value)||0;if(c>bC)return alert('CFA bai isa ba! CFA '+bC);bC-=c;bN+=n;hist.unshift('✅ CONVERT '+c+' CFA → ₦'+n);}
else if(pend.includes('NGN→CFA')){let n=parseFloat(document.getElementById('fromN').value)||0,c=parseFloat(document.getElementById('toC').value)||0;if(n>bN)return alert('₦ bai isa ba! ₦'+bN);bN-=n;bC+=c;hist.unshift('✅ CONVERT ₦'+n+' → '+c+' CFA');}
else if(pend.includes('NG')){let a=parseFloat(document.getElementById('amNG').value)||0;if(a>bN)return alert('₦ bai isa ba!');bN-=a;hist.unshift('✅ '+pend+' ₦'+a);}
else{let a=parseFloat(document.getElementById('amNE').value)||0;if(a>bC)return alert('CFA bai isa ba!');bC-=a;hist.unshift('✅ '+pend+' CFA '+a);}
save();upd();alert('SUCCESS! '+pend);}
function upd(){document.getElementById('bC').innerText='CFA '+bC.toLocaleString();document.getElementById('bN').innerText='₦'+bN.toLocaleString();document.getElementById('balT').innerText='CFA '+bC.toLocaleString()+' | ₦'+bN.toLocaleString();document.getElementById('hist').innerHTML=hist.join('<br>')||'Babu';save();}
calcC();calcN();
</script></body></html>
