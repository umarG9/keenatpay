<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KeenatPay by Baba - Call 7012869066</title>
<meta name="theme-color" content="#0a1a4a">
<link rel="manifest" href="./manifest.json">
<style>*{box-sizing:border-box;font-family:system-ui,sans-serif;margin:0;padding:0}body{background:#eef2ff}.header{background:#0a1a4a;color:#fff;padding:16px;text-align:center}.card{background:#fff;margin:12px;padding:16px;border-radius:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}input,select,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #ddd;font-size:16px}button{background:#0a1a4a;color:#fff;font-weight:bold}.pin-input{font-size:28px;text-align:center;letter-spacing:10px;font-weight:bold;border:2px solid #0a1a4a;background:#f0f7ff}.hidden{display:none}.face-box{position:relative;max-width:320px;margin:10px auto;background:#000;border-radius:16px;overflow:hidden}#video{width:100%;height:260px;object-fit:cover}.face-guide{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:180px;height:220px;border:3px dashed #00ff88;border-radius:50%}.secure{background:#e8f5e9;border-left:4px solid #00c853;padding:8px;margin:8px 0;font-size:12px}.small{font-size:12px;color:#555;text-align:center}</style>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(() => console.log('KeenatPay by Baba SW OK ✅'))
      .catch(e => console.log('SW fail', e));
  });
}
</script>
</head>
<body>
<div class="header"><h2>KeenatPay by Baba</h2><small>Call 7012869066 | OTP + Face + PIN | Niger ↔ Nigeria</small></div>
<div id="login" class="card"><h3 style="text-align:center">KeenatPay by Baba - Register</h3><div class="secure">✅ COMPLETE - Baba Edition - OTP → Face → PIN</div>
<div id="step1"><input id="ph" value="07012869066" type="tel"><button onclick="sendOtp()">Tura OTP 📲</button></div>
<div id="step2" class="hidden"><p style="text-align:center"><span id="otpDemo" style="background:#00ff88;padding:6px 14px;border-radius:8px;font-weight:bold;font-size:20px"></span></p><input id="otpInput" maxlength="6" style="text-align:center;font-size:24px;letter-spacing:8px"><button onclick="verifyOtp()">Tabbatar OTP</button></div>
<div id="step3" class="hidden"><div class="face-box"><video id="video" autoplay playsinline></video><div class="face-guide"></div></div><p id="faceStatus" style="text-align:center;font-weight:bold">Danna Bude Kamara</p><img id="facePreview" class="hidden" style="width:200px;margin:10px auto;display:block;border-radius:12px;border:3px solid #00c853"><button id="camBtn" onclick="startCamera()">Bude Kamara 📷</button><button id="captureBtn" class="hidden" onclick="captureFace()" style="background:#00c853;color:#000">Dauki Hoto</button><button id="faceNextBtn" class="hidden" onclick="completeFace()">Face OK ➡️</button><canvas id="canvas" style="display:none"></canvas></div>
<div id="step4" class="hidden"><input id="pinSet" type="tel" maxlength="4" placeholder="1234" class="pin-input"><button onclick="finalRegister()">Shiga App 🚀</button></div>
</div>
<div id="pinModal" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.85);z-index:100;display:flex;align-items:center;justify-content:center"><div class="card" style="width:90%;max-width:360px"><h3 style="text-align:center">🔐 Saka PIN</h3><input id="pinVerify" type="tel" maxlength="4" placeholder="1234" class="pin-input"><p id="pinError" style="color:red;text-align:center;display:none"></p><p id="savedPinInfo" style="text-align:center;font-size:12px;color:green"></p><button onclick="verifyPinAction()">Tabbatar PIN ✅</button><button style="background:#ccc;color:#000" onclick="closePinModal()">Soke</button><button style="background:#ff9800;margin-top:8px" onclick="resetPinDirect()">Manta PIN? Sake Saita 🔄</button></div></div>
<div id="app" class="hidden"><div class="card" style="background:linear-gradient(135deg,#0a1a4a,#2a5bd7);color:#fff;text-align:center"><h2 id="bCFA">50,000 CFA</h2><h2 id="bNGN">₦25,000</h2><p id="uph"></p><img id="userFace" style="width:80px;height:80px;border-radius:50%;border:3px solid #00ff88;display:none;margin:8px auto"><button style="background:#00ff88;color:#000" onclick="requestPin('fund')">Fund - PIN</button></div><div class="card"><h3>💱 CFA ↔ NGN</h3><select id="fC" onchange="calc()"><option value="CFA">From CFA</option><option value="NGN">From NGN</option></select><input id="fA" type="number" value="10000" oninput="calc()"><select id="tC"><option value="NGN">To NGN</option><option value="CFA">To CFA</option></select><input id="tA" readonly style="background:#e8f5e9;font-weight:bold"><button style="background:#000;color:#00ff88" onclick="requestPin('convert')">Tura Kudi - PIN</button></div><div class="card"><div id="hist">No tx</div><button onclick="location.reload()" style="background:#dc3545">Logout</button></div></div>
<script>
let generatedOtp='',userPhone='',balC=50000,balN=25000,hist=[],stream=null,faceDone=false;
function sendOtp(){let ph=document.getElementById('ph').value.trim();userPhone=ph;generatedOtp=Math.floor(100000+Math.random()*900000).toString();document.getElementById('step1').classList.add('hidden');document.getElementById('step2').classList.remove('hidden');document.getElementById('otpDemo').innerText=generatedOtp;}
function verifyOtp(){let otp=document.getElementById('otpInput').value.trim();if(otp!==generatedOtp)return alert('OTP ba daidai ba! '+generatedOtp);document.getElementById('step2').classList.add('hidden');document.getElementById('step3').classList.remove('hidden');}
async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});document.getElementById('video').srcObject=stream;document.getElementById('faceStatus').innerText='Kamara a bude';document.getElementById('camBtn').classList.add('hidden');document.getElementById('captureBtn').classList.remove('hidden');}catch(e){faceDone=true;document.getElementById('faceStatus').innerText='An yarda ba tare da kamara ba';document.getElementById('faceNextBtn').classList.remove('hidden');}}
function captureFace(){let v=document.getElementById('video'),c=document.getElementById('canvas');if(v.videoWidth){c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let d=c.toDataURL('image/jpeg');document.getElementById('facePreview').src=d;document.getElementById('facePreview').classList.remove('hidden');localStorage.setItem('face_'+userPhone,d);}document.getElementById('faceStatus').innerHTML='✅ Face Verified!';document.getElementById('faceNextBtn').classList.remove('hidden');faceDone=true;if(stream)stream.getTracks().forEach(t=>t.stop());}
function completeFace(){document.getElementById('step3').classList.add('hidden');document.getElementById('step4').classList.remove('hidden');}
function finalRegister(){let pin=document.getElementById('pinSet').value.trim();if(pin.length!==4)return alert('Saka 4 lambobi!');localStorage.setItem('pin_'+userPhone,pin);localStorage.setItem('phone_baba',userPhone);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('uph').innerText=userPhone+' | KeenatPay by Baba';let f=localStorage.getItem('face_'+userPhone);if(f){let i=document.getElementById('userFace');i.src=f;i.style.display='block';}alert('SUCCESS! PIN: '+pin);calc();}
let pendingAction=null;
function requestPin(a){pendingAction=a;let s=localStorage.getItem('pin_'+userPhone)||'1234';document.getElementById('pinModal').classList.remove('hidden');document.getElementById('pinModal').style.display='flex';document.getElementById('pinVerify').value='';document.getElementById('pinError').style.display='none';document.getElementById('savedPinInfo').innerText='💡 PIN: '+s;document.getElementById('pinVerify').focus();}
function verifyPinAction(){let pin=document.getElementById('pinVerify').value.trim();let saved=localStorage.getItem('pin_'+userPhone)||'1234';if(pin!==saved){document.getElementById('pinError').style.display='block';document.getElementById('pinError').innerHTML='Ba daidai ba! Daidai: <b>'+saved+'</b>';return;}closePinModal();if(pendingAction==='convert'){let am=parseFloat(document.getElementById('fA').value)||0,f=document.getElementById('fC').value,to=parseFloat(document.getElementById('tA').value)||0;if(f=='CFA')balC-=am;else balN-=am;if(f=='CFA')balN+=to;else balC+=to;document.getElementById('bCFA').innerText=balC.toLocaleString()+' CFA';document.getElementById('bNGN').innerText='₦'+balN.toLocaleString();let m='✅ Convert '+am+' → '+to.toFixed(2)+' PIN OK';hist.unshift(m);document.getElementById('hist').innerHTML=hist.join('<br>');alert(m);}if(pendingAction==='fund'){balN+=5000;document.getElementById('bNGN').innerText='₦'+balN;alert('✅ Fund ₦5000');}}
function resetPinDirect(){let n=prompt('Saka SABON PIN:');if(n&&n.length===4){localStorage.setItem('pin_'+userPhone,n);alert('PIN: '+n);closePinModal();}}
function closePinModal(){document.getElementById('pinModal').classList.add('hidden');document.getElementById('pinModal').style.display='none';}
function calc(){let f=document.getElementById('fC').value,am=parseFloat(document.getElementById('fA').value)||0,r=0;if(f=='CFA')r=am/2.5*0.95;else r=am*2.5*0.95;document.getElementById('tA').value=r?r.toFixed(2):'';}
</script>
</body>
</html>
