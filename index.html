<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KeenatPay</title><style>*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}body{background:#eef2ff}.h{background:#0a1a4a;color:#fff;padding:14px;text-align:center}.c{background:#fff;margin:8px;padding:14px;border-radius:12px;border:1px solid #ddd}input,select,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ddd}button{background:#0a1a4a;color:#fff;font-weight:900;border:none}.tab{padding:8px 12px;background:#eef2ff;border-radius:20px;display:inline-block;margin:3px;font-size:12px;font-weight:800}.active{background:#0a1a4a;color:#fff!important}.hidden{display:none!important}.bal{background:#0a1a4a;color:#fff;text-align:center}.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px}</style></head><body>
<div class="h"><h2>KeenatPay REAL</h2><p id="balT">CFA 0 | ₦0</p><small>07012869066 Umar Hadi Gwani</small></div>
<div id="login" class="c"><input id="ph" value="07012869066"><button onclick="sO()">Tura OTP</button><div id="s2" class="hidden"><p>OTP: <b id="oD" style="background:#0f0;padding:5px"></b> ko 123456</p><input id="oI" placeholder="OTP"><button onclick="vO()">Tabbatar</button></div><div id="s4" class="hidden"><input id="pS" type="password" placeholder="PIN 4" maxlength="4"><button onclick="fin()">Shiga</button></div></div>
<div id="app" class="hidden">
<div class="c bal"><h2 id="bC">CFA 0</h2><h2 id="bN">₦0</h2></div>
<div class="c"><span class="tab active" onclick="tab('d',this)">Deposit REAL</span><span class="tab" onclick="tab('c',this)">Convert 2.30</span><span class="tab" onclick="tab('ng',this)">NG Bank</span><span class="tab" onclick="tab('ne',this)">Niger</span></div>
<div id="d" class="c" style="border:2px solid #0c0"><h3>Deposit REAL</h3><p style="background:#0a1a4a;color:#fff;padding:8px;border-radius:8px;font-size:12px">Moniepoint: 07012869066 - KeenatPay</p><input id="depN" type="number" placeholder="Naira 5000"><button onclick="depN()" style="background:#0c0;color:#000">Saka Naira +</button><input id="depC" type="number" placeholder="CFA 10000"><button onclick="depC()" style="background:#fa0;color:#000">Saka CFA +</button></div>
<div id="c" class="c hidden" style="border:2px solid #0c0"><h3>Convert 1=2.30 (5% fee)</h3>CFA<input id="fromC" type="number" value="10000" oninput="calcC()"><input id="toN" readonly><button onclick="doPay('CFA-NGN')" style="background:#0c0;color:#000">Convert PIN</button><hr>NGN<input id="fromN" type="number" value="5000" oninput="calcN()"><input id="toC" readonly><button onclick="doPay('NGN-CFA')">Convert PIN</button></div>
<div id="ng" class="c hidden"><h3>NG Transfer</h3><select><option>PalmPay</option><option>Moniepoint</option><option>UBA</option></select><input id="aNG" placeholder="Account"><input id="amNG" type="number" placeholder="Amount"><button onclick="doPay('NG')">Tura PIN</button></div>
<div id="ne" class="c hidden"><h3>Niger Transfer</h3><select><option>Airtel Money</option><option>Orange</option></select><input id="aNE" placeholder="227..."><input id="amNE" type="number" placeholder="CFA"><button onclick="doPay('NE')">Tura PIN</button></div>
<div class="c"><div id="hist" style="background:#eee;padding:8px;font-size:12px">Babu</div><button onclick="location.reload()" style="background:red">Logout</button></div>
</div>
<div id="pm" class="hidden modal"><div class="c" style="width:90%"><h3 id="pt">PIN</h3><input id="pV" type="password" placeholder="****" maxlength="4"><p id="pE" style="color:red;display:none"></p><button onclick="cP()">OK</button><button style="background:#ccc;color:#000" onclick="document.getElementById('pm').classList.add('hidden')">Soke</button></div></div>
<script>
let g='',u='',bC=0,bN=0,pe='',hi=[];
function ld(){try{let d=JSON.parse(localStorage.getItem('kp_'+(u||'070'))||'{}');bC=d.bC||0;bN=d.bN||0;hi=d.hi||[];}catch(e){}}function sv(){localStorage.setItem('kp_'+u,JSON.stringify({bC:bC,bN:bN,hi:hi}));}
function sO(){u=document.getElementById('ph').value;g=Math.floor(100000+Math.random()*900000)+'';document.getElementById('oD').innerText=g;document.getElementById('s2').classList.remove('hidden');ld();}
function vO(){let v=document.getElementById('oI').value;if(v!==g&&v!=='123456')return alert('OTP: '+g);document.getElementById('s4').classList.remove('hidden');}
function fin(){let p=document.getElementById('pS').value;if(p.length<4)return alert('PIN 4');localStorage.setItem('pin_'+u,p);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');ld();calcC();calcN();up();}
function tab(i,e){['d','c','ng','ne'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(i).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));e.classList.add('active');}
function calcC(){document.getElementById('toN').value=((parseFloat(document.getElementById('fromC').value)||0)*2.30*0.95).toFixed(2)+' NGN';}
function calcN(){document.getElementById('toC').value=((parseFloat(document.getElementById('fromN').value)||0)/2.30*0.95).toFixed(0)+' CFA';}
function depN(){let a=parseFloat(document.getElementById('depN').value)||0;if(a<100)return alert('Min 100');bN+=a;hi.unshift('DEPOSIT ₦'+a);sv();up();alert('₦'+a+' ya shiga');}
function depC(){let a=parseFloat(document.getElementById('depC').value)||0;if(a<100)return alert('Min 100');bC+=a;hi.unshift('DEPOSIT CFA '+a);sv();up();alert('CFA '+a+' ya shiga');}
function doPay(t){pe=t;document.getElementById('pm').classList.remove('hidden');document.getElementById('pt').innerText='PIN - '+t;}
function cP(){let p=document.getElementById('pV').value,s=localStorage.getItem('pin_'+u)||'1234';if(p!==s){document.getElementById('pE').style.display='block';document.getElementById('pE').innerText='PIN ba daidai!';return;}document.getElementById('pm').classList.add('hidden');
if(pe.includes('CFA-NGN')){let c=parseFloat(document.getElementById('fromC').value)||0,n=parseFloat(document.getElementById('toN').value)||0;if(c>bC)return alert('CFA bai isa');bC-=c;bN+=n;hi.unshift('CONVERT '+c+' CFA → ₦'+n);}
else if(pe.includes('NGN-CFA')){let n=parseFloat(document.getElementById('fromN').value)||0,c=parseFloat(document.getElementById('toC').value)||0;if(n>bN)return alert('₦ bai isa');bN-=n;bC+=c;hi.unshift('CONVERT ₦'+n+' → '+c+' CFA');}
else if(pe=='NG'){let a=parseFloat(document.getElementById('amNG').value)||0;if(a>bN)return alert('₦ bai isa');bN-=a;hi.unshift('NG ₦'+a);}
else{let a=parseFloat(document.getElementById('amNE').value)||0;if(a>bC)return alert('CFA bai isa');bC-=a;hi.unshift('NE CFA '+a);}
sv();up();alert(pe+' SUCCESS');}
function up(){document.getElementById('bC').innerText='CFA '+bC.toLocaleString();document.getElementById('bN').innerText='₦'+bN.toLocaleString();document.getElementById('balT').innerText='CFA '+bC.toLocaleString()+' | ₦'+bN.toLocaleString();document.getElementById('hist').innerHTML=hi.join('<br>')||'Babu';sv();}
calcC();calcN();
</script></body></html>
